<body>

    <!--flex-direction-ის დახმარებით შეგვიძლია ვაკონტროლოთ ელემენტების ადგილმდებარეობა x და y ღერძზე.-->

    <!--align-items justify-content-ისგან განსხვავებით ელემენტებს ალაგებს ვერტიკალურად-->
    <!--gap არეგულირებს დისტანციას ელემენტებს შორის-->
