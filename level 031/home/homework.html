<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--dimensions არის საზომი ერთეულები, არის რამდენიმე: px, vh, %... ამ ერთეულების მინიჭება ხდება width და height ატრიბუტებით.-->
    
    <div id="div1"></div>
    <div id="div2"></div>
    <div id="div3"></div>


    <h1>helloooooooooo</h1>

    <p class="p1">hii</p>
    <p class="p1">hello</p>
    <p class="p1">meow</p>
    <p class="p1">cat</p>
    <p class="p1">icecream</p>

    <p class="p2">bye</p>
    <p class="p2">goodbye</p>
    <p class="p2">nope</p>
    <p class="p2">dog</p>
    <p class="p2">chocolate</p>


    <!--ეკრანი შედგება პიქსელებისგან, ყველა ეკრანს გააჩნია განსხვავებული რაოდენობის პიქსელი. რესპონსიული საიტის დიზაინი ნიშნავს იმას, რომ ეს საიტი სხვადასხვა მოწყობილობის ეკრანზე არის მორგებული. პროცენტებით ზომის გაწერა კი ასეთი საიტის მიღწევაში გვეხმარება.-->


    <style>
        #div1 {
            background-color: pink;
            width: 500px;
            height: 300px;
        }

        #div2 {
            background-color: bisque;
            width:30vh;
            height: 50vh;
        }

        #div3 {
            background-color: aquamarine;
            width: 100px;
            height: 200px;
        }

        h1 {
            color: #ffbdc7;
            font-size: larger;
        }

        .p1 {
            color:rgb(255, 170, 224);
        }

        .p2 {
            color: #ffbdc7;
        }
    </style>
</body>
</html>
