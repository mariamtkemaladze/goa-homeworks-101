<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <ol>
        <li>mari</li>
        <li>ele</li>
        <li>dato</li>
        <li>lasha</li>
        <li>nini</li>
    </ol>

    <!--konkretuli tipis inputebis gasastilvad jer unda mivwvdet forms mere mis types. form[type="text"]-->
    <br>
    <br>
    <br>
    <form>
        <br>
        <h1>online registration form</h1>
        <label for="name">Name</label>
        <br>
        <input type="text" name="name" placeholder="First" id="name">

        <input type="text" placeholder="Last" id="last">
        <br>
        <label for="email">Email</label>
        <br>
        <input type="email" name="email">
        <br>
        <label for="phone">Phone</label>
        <br>
        <input type="tel" placeholder="### ### ###" name="phone">
        <br>
        <label for="msg">Message</label>
        <br>
        <input type="text" name="msg">
        <br>
        <br>
        <input type="submit" id="btn">
    </form>
</body>
</html>
