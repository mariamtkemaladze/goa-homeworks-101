<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <!--vide tag lets us embed a video on our site, audio tag is to attach an audio on our site, and source tag is where we keep that link of video or audio. type tag helps to understand what type of link we've attached to the site.-->

    <!--video attributes are: controls (helps us see the video format on the site), loop (video or audio repeats itself when it's finished playing), and autoplay(starts playing without our help)-->

    <h1>videos in my camera</h1>
    <br>
    <video controls>
        <source src="MVI_6713.MOV">
    </video>
</body>
</html>
